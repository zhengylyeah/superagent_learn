<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>2048</title>
<style>
  :root {
    --bg: #faf8ef;
    --grid-bg: #bbada0;
    --cell-bg: rgba(238, 228, 218, 0.35);
    --text: #776e65;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg);
    font-family: "Clear Sans", "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { width: min(92vw, 500px); user-select: none; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  h1 { font-size: clamp(40px, 10vw, 64px); font-weight: 700; color: var(--text); }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--grid-bg);
    border-radius: 6px;
    padding: 8px 18px;
    text-align: center;
    color: #eee4da;
    min-width: 90px;
  }
  .score-box .label { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  .score-box .value { font-size: 24px; font-weight: 700; color: #fff; }
  .subbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .subbar p { font-size: 14px; line-height: 1.4; }
  .subbar p b { color: #f67c5f; }
  button {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { background: #9f8b77; }
  .board {
    position: relative;
    background: var(--grid-bg);
    border-radius: 10px;
    padding: 2%;
    aspect-ratio: 1;
    touch-action: none;
  }
  .cell, .tile {
    position: absolute;
    width: 22.75%;
    height: 22.75%;
    border-radius: 6px;
  }
  .cell { background: var(--cell-bg); }
  .tile {
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 700;
    transition: top 120ms ease-in-out, left 120ms ease-in-out;
    z-index: 2;
  }
  .tile.new, .tile.merged { animation: pop 200ms ease 60ms; animation-fill-mode: backwards; }
  @keyframes pop {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
  }
  .t2    { background: #eee4da; color: var(--text); font-size: clamp(24px, 7vw, 44px); }
  .t4    { background: #ede0c8; color: var(--text); font-size: clamp(24px, 7vw, 44px); }
  .t8    { background: #f2b179; color: #f9f6f2; font-size: clamp(24px, 7vw, 44px); }
  .t16   { background: #f59563; color: #f9f6f2; font-size: clamp(22px, 6vw, 40px); }
  .t32   { background: #f67c5f; color: #f9f6f2; font-size: clamp(22px, 6vw, 40px); }
  .t64   { background: #f65e3b; color: #f9f6f2; font-size: clamp(22px, 6vw, 40px); }
  .t128  { background: #edcf72; color: #f9f6f2; font-size: clamp(18px, 5vw, 34px); }
  .t256  { background: #edcc61; color: #f9f6f2; font-size: clamp(18px, 5vw, 34px); }
  .t512  { background: #edc850; color: #f9f6f2; font-size: clamp(18px, 5vw, 34px); }
  .t1024 { background: #edc53f; color: #f9f6f2; font-size: clamp(15px, 4vw, 28px); }
  .t2048 { background: #edc22e; color: #f9f6f2; font-size: clamp(15px, 4vw, 28px); box-shadow: 0 0 30px 8px rgba(243, 215, 116, 0.5); }
  .tile.super { background: #3c3a32; color: #f9f6f2; font-size: clamp(13px, 3.5vw, 24px); }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, 0.78);
    border-radius: 10px;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  .overlay.show { display: flex; }
  .overlay h2 { font-size: clamp(36px, 9vw, 56px); margin-bottom: 8px; }
  .overlay.win h2 { color: #edc22e; }
  .overlay p { font-size: 18px; margin-bottom: 18px; }
  footer { margin-top: 14px; font-size: 13px; color: #a4988a; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-box"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </header>
  <div class="subbar">
    <p>方向键 <b>↑ ↓ ← →</b> 移动，相同数字合并！<br>（也支持 WASD 与触屏滑动）</p>
    <button id="restart">新游戏</button>
  </div>
  <div class="board" id="board">
    <div class="overlay" id="overlay">
      <h2 id="overlay-title"></h2>
      <p id="overlay-sub"></p>
      <button id="overlay-btn">再来一局</button>
    </div>
  </div>
  <footer>合并到 <b>2048</b> 即获胜，还能继续挑战更高分！</footer>
</div>
<script>
(function () {
  "use strict";

  var SIZE = 4;
  var boardEl = document.getElementById("board");
  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlay-title");
  var overlaySub = document.getElementById("overlay-sub");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("best");

  var score = 0;
  var best = Number(localStorage.getItem("2048-best") || 0);
  bestEl.textContent = best;

  // Grid cells are {value, el}; null for empty.
  var grid = [];
  var tilesById = Object.create(null);
  var nextTileId = 1;
  var won = false;
  var over = false;
  var animating = false;

  // Create the static background cells.
  for (var r = 0; r < SIZE; r++) {
    for (var c = 0; c < SIZE; c++) {
      var cell = document.createElement("div");
      cell.className = "cell";
      positionElement(cell, r, c);
      boardEl.appendChild(cell);
    }
  }

  function positionElement(el, row, col) {
    // padding 2%, gap 3.25% of board => cell size 22.75%
    el.style.top = (2 + row * 26) + "%";
    el.style.left = (2 + col * 26) + "%";
  }

  function makeTile(value, row, col, isNew, isMerged) {
    var el = document.createElement("div");
    var tile = { id: nextTileId++, value: value, row: row, col: col, el: el };
    el.className = "tile t" + value + (value > 2048 ? " super" : "");
    if (value > 2048) el.classList.remove("t" + value);
    if (isNew) el.classList.add("new");
    if (isMerged) el.classList.add("merged");
    el.textContent = value;
    positionElement(el, row, col);
    boardEl.appendChild(el);
    tilesById[tile.id] = tile;
    return tile;
  }

  function removeTile(tile) {
    tile.el.remove();
    delete tilesById[tile.id];
  }

  function emptyCells() {
    var cells = [];
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (!grid[r][c]) cells.push({ row: r, col: c });
      }
    }
    return cells;
  }

  function addRandomTile() {
    var cells = emptyCells();
    if (!cells.length) return;
    var spot = cells[Math.floor(Math.random() * cells.length)];
    grid[spot.row][spot.col] = makeTile(Math.random() < 0.9 ? 2 : 4, spot.row, spot.col, true, false);
  }

  function setScore(value) {
    score = value;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem("2048-best", best);
    }
  }

  function reset() {
    Object.keys(tilesById).forEach(function (id) { tilesById[id].el.remove(); });
    tilesById = Object.create(null);
    grid = [];
    for (var r = 0; r < SIZE; r++) grid.push([null, null, null, null]);
    setScore(0);
    won = false;
    over = false;
    hideOverlay();
    addRandomTile();
    addRandomTile();
  }

  // Build traversal order so tiles closest to the move direction go first.
  function traversals(dir) {
    var rows = [], cols = [];
    for (var i = 0; i < SIZE; i++) { rows.push(i); cols.push(i); }
    if (dir === "right") cols.reverse();
    if (dir === "down") rows.reverse();
    return { rows: rows, cols: cols };
  }

  function vector(dir) {
    return { up: { r: -1, c: 0 }, down: { r: 1, c: 0 }, left: { r: 0, c: -1 }, right: { r: 0, c: 1 } }[dir];
  }

  function withinBounds(r, c) {
    return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
  }

  function findFarthest(row, col, v) {
    var prev;
    do {
      prev = { r: row, c: col };
      row += v.r;
      col += v.c;
    } while (withinBounds(row, col) && !grid[row][col]);
    return { farthest: prev, next: withinBounds(row, col) ? grid[row][col] : null };
  }

  function movesAvailable() {
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        if (!grid[r][c]) return true;
        var val = grid[r][c].value;
        if (r + 1 < SIZE && grid[r + 1][c] && grid[r + 1][c].value === val) return true;
        if (c + 1 < SIZE && grid[r][c + 1] && grid[r][c + 1].value === val) return true;
      }
    }
    return false;
  }

  function move(dir) {
    if (over || animating) return;
    var v = vector(dir);
    var t = traversals(dir);
    var moved = false;
    var gained = 0;
    var mergedThisMove = [];

    t.rows.forEach(function (r) {
      t.cols.forEach(function (c) {
        var tile = grid[r][c];
        if (!tile) return;
        var result = findFarthest(r, c, v);
        var next = result.next;
        if (next && next.value === tile.value && mergedThisMove.indexOf(next.id) === -1) {
          // Merge into `next`'s cell: new tile appears there.
          grid[tile.row][tile.col] = null;
          grid[next.row][next.col] = null;
          removeTile(tile);
          removeTile(next);
          var merged = makeTile(tile.value * 2, next.row, next.col, false, true);
          grid[next.row][next.col] = merged;
          mergedThisMove.push(merged.id);
          gained += merged.value;
          if (merged.value === 2048 && !won) won = true;
          moved = true;
        } else if (result.farthest.r !== tile.row || result.farthest.c !== tile.col) {
          grid[tile.row][tile.col] = null;
          tile.row = result.farthest.r;
          tile.col = result.farthest.c;
          grid[tile.row][tile.col] = tile;
          positionElement(tile.el, tile.row, tile.col);
          moved = true;
        }
      });
    });

    if (!moved) return;

    setScore(score + gained);
    addRandomTile();

    // Wait for the slide transition before evaluating game state.
    animating = true;
    setTimeout(function () {
      animating = false;
      if (won) showOverlay("win");
      else if (!movesAvailable()) {
        over = true;
        showOverlay("lose");
      }
    }, 160);
  }

  function showOverlay(kind) {
    if (kind === "win") {
      overlay.classList.add("win");
      overlayTitle.textContent = "你赢了！🎉";
      overlaySub.textContent = "得分 " + score + "，继续挑战更高数字？";
      overlayBtn.textContent = "继续游戏";
      overlayBtn.onclick = function () { hideOverlay(); won = true; /* keep playing */ };
    } else {
      overlay.classList.remove("win");
      overlayTitle.textContent = "游戏结束";
      overlaySub.textContent = "最终得分 " + score;
      overlayBtn.textContent = "再来一局";
      overlayBtn.onclick = function () { reset(); };
    }
    overlay.classList.add("show");
  }

  function hideOverlay() {
    overlay.classList.remove("show");
  }

  var overlayBtn = document.getElementById("overlay-btn");
  var restartBtn = document.getElementById("restart");
  restartBtn.addEventListener("click", function () { reset(); });

  document.addEventListener("keydown", function (e) {
    var map = {
      ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
      w: "up", s: "down", a: "left", d: "right",
      W: "up", S: "down", A: "left", D: "right"
    };
    var dir = map[e.key];
    if (!dir) return;
    if (overlay.classList.contains("show")) return;
    e.preventDefault();
    move(dir);
  });

  // Touch swipe support.
  var touchStart = null;
  boardEl.addEventListener("touchstart", function (e) {
    if (e.touches.length === 1) {
      touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    }
  }, { passive: true });
  boardEl.addEventListener("touchend", function (e) {
    if (!touchStart) return;
    var dx = e.changedTouches[0].clientX - touchStart.x;
    var dy = e.changedTouches[0].clientY - touchStart.y;
    touchStart = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? "right" : "left");
    } else {
      move(dy > 0 ? "down" : "up");
    }
  }, { passive: true });

  reset();

  // Minimal test hook (non-intrusive, used by automated checks).
  window.__2048 = {
    gridValues: function () {
      return grid.map(function (row) { return row.map(function (t) { return t ? t.value : 0; }); });
    },
    tileCount: function () { return document.querySelectorAll("#board > .tile").length; }
  };
})();
</script>
</body>
</html>
